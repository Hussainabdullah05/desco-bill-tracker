<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESCO Bill Tracker</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/styles.css">

    <meta name="theme-color" content="#0061A4">
</head>

<body>

<header class="topbar">
    <h1>⚡ DESCO Bill Tracker</h1>
</header>

<main class="container">

    <section class="card">

        <label>Month</label>

        <input
            type="month"
            id="month">

        <label>Monthly Consumption (kWh)</label>

        <input
            type="number"
            id="units"
            placeholder="Enter kWh">

    </section>

    <section class="card">

        <h2>Estimated Bill</h2>

        <div class="bill-total">
            ৳ <span id="totalBill">0.00</span>
        </div>

        <hr>

        <div class="row">
            <span>Energy Charge</span>
            <span id="energyCharge">0.00</span>
        </div>

        <div class="row">
            <span>VAT</span>
            <span id="vat">0.00</span>
        </div>

        <div class="row">
            <span>Meter Rent</span>
            <span id="meterRent">0.00</span>
        </div>

        <div class="row">
            <span>Other Charges</span>
            <span id="otherCharges">0.00</span>
        </div>

    </section>

    <button id="saveBtn">
        Save Bill
    </button>

</main>

<nav class="bottom-nav">

    <button class="active">
        Dashboard
    </button>

    <button>
        History
    </button>

    <button>
        Settings
    </button>

</nav>

<script src="js/api.js"></script>
<script src="js/calculator.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>

</body>
</html>
