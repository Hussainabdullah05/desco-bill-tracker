<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DESCO Bill Tracker</title>

    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/history.css">
    <link rel="stylesheet" href="css/settings.css">

    <meta name="theme-color" content="#0061A4">

</head>


<body>


<header class="app-bar">

    <div class="app-title">
        ⚡ DESCO Bill Tracker
    </div>

</header>



<main>


<!-- ================= DASHBOARD ================= -->

<section id="dashboard" class="page active">


    <div class="card">

        <h3>Current Month</h3>

        <input 
        type="month"
        id="billMonth">


    </div>



    <div class="card bill-card">


        <h3>Estimated Bill</h3>


        <div class="amount">

            ৳ <span id="totalBill">
                0.00
            </span>

        </div>


    </div>




    <div class="card">


        <div class="stats">


            <div>

                <span>
                    Units
                </span>

                <strong id="totalUnits">
                    0 kWh
                </strong>

            </div>



            <div>

                <span>
                    Average/day
                </span>

                <strong id="averageDaily">
                    0 kWh
                </strong>

            </div>


        </div>


    </div>




    <div class="card">


        <h3>
            Bill Breakdown
        </h3>


        <div class="bill-row">
            <span>
                Energy Charge
            </span>

            <span id="energyCharge">
                ৳0
            </span>
        </div>



        <div class="bill-row">

            <span>
                VAT
            </span>

            <span id="vat">
                ৳0
            </span>

        </div>



        <div class="bill-row">

            <span>
                Meter Rent
            </span>

            <span id="meterRent">
                ৳0
            </span>

        </div>



        <div class="bill-row">

            <span>
                Other Charges
            </span>

            <span id="otherCharges">
                ৳0
            </span>

        </div>


    </div>





    <div class="card">

        <label>
            Monthly Consumption (kWh)
        </label>


        <input
        type="number"
        id="units"
        placeholder="Enter kWh">


    </div>




    <button id="saveBtn" class="fab">

        Save Bill

    </button>



</section>









<!-- ================= HISTORY ================= -->


<section id="history" class="page">


    <div class="card">

        <h2>
            Bill History
        </h2>


        <div id="historyList">

            Loading...

        </div>


    </div>


</section>









<!-- ================= CHARTS ================= -->


<section id="charts" class="page">


    <div class="card">

        <h2>
            Analytics
        </h2>


        <div class="stats">


            <div>

                <span>
                    Average Usage
                </span>

                <strong id="avgUsage">
                    0 kWh
                </strong>

            </div>



            <div>

                <span>
                    Average Bill
                </span>

                <strong id="avgBill">
                    ৳0
                </strong>

            </div>


        </div>


    </div>





    <div class="card">


        <h3>
            Monthly Usage
        </h3>


        <canvas id="usageChart"></canvas>


    </div>





    <div class="card">


        <h3>
            Monthly Bill
        </h3>


        <canvas id="billChart"></canvas>


    </div>



</section>









<!-- ================= SETTINGS ================= -->


<section id="settings" class="page">


    <div class="card">


        <section id="settings" class="page">


    <div class="card">


        <h2>
            Bill Settings
        </h2>


        <label>
            VAT (%)
        </label>

        <input 
        type="number"
        id="vatInput">



        <label>
            Meter Rent
        </label>

        <input 
        type="number"
        id="meterRentInput">



        <label>
            Other Charges
        </label>

        <input 
        type="number"
        id="otherChargesInput">



        <button 
        id="saveSettingsBtn"
        class="fab">

        Save Settings

        </button>


    </div>


</section>


</section>



</main>







<!-- ================= NAVIGATION ================= -->


<nav class="bottom-nav">


<button data-page="dashboard" class="active">

🏠
<br>
Home

</button>



<button data-page="history">

📜
<br>
History

</button>



<button data-page="charts">

📊
<br>
Charts

</button>



<button data-page="settings">

⚙️
<br>
Settings

</button>


</nav>









<script src="js/api.js"></script>

<script src="js/calculator.js"></script>

<script src="js/utils.js"></script>

<script src="js/dashboard.js"></script>

<script src="js/history.js"></script>

<script src="js/charts.js"></script>

<script src="js/settings.js"></script>
    
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="js/app.js"></script>



<script>

if("serviceWorker" in navigator){

    navigator.serviceWorker.register("sw.js");

}

</script>


</body>

</html>
